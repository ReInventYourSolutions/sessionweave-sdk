[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sessionweave-sdk"
version = "0.13.0"
description = "Async Python client for the SessionWeave broker (REST + WebSocket)"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [
    { name = "ReInventYourSolutions" },
]
keywords = ["sessionweave", "multi-agent", "mcp", "client"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/ReInventYourSolutions/sessionweave-sdk"
Source = "https://github.com/ReInventYourSolutions/sessionweave-sdk"
Broker = "https://github.com/ReInventYourSolutions/sessionweave-broker"
Guide = "https://github.com/ReInventYourSolutions/sessionweave-broker/blob/main/docs/guide/README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sessionweave_client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
