[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sessionweave-client"
version = "0.10.0"
description = "Async Python client for the SessionWeave relay (REST + WebSocket)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [
    { name = "SessionWeave contributors" },
]
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/EnzinoBB/SessionWeave"
Relay = "https://github.com/ReInventYourSolutions/sessionweave-broker"

[tool.hatch.build.targets.wheel]
packages = ["src/sessionweave_client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
